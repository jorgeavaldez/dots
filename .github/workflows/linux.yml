name: Linux dotfiles

on:
  pull_request:
  push:
    branches: [main, nushell]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:bookworm
            seed: apt-get update && apt-get install -y ca-certificates curl git python3 build-essential xz-utils ncurses-bin
          - image: archlinux:base-devel
            seed: pacman -Syu --noconfirm --needed ca-certificates curl git python base-devel xz ncurses
    container: ${{ matrix.image }}
    steps:
      # Disposable CI images need provisioning. Bootstrap itself never does this.
      - name: Seed test container
        run: ${{ matrix.seed }}
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
          cache: false
      - name: Install test tools only
        run: mise install nu@0.115.1 fnox@1.35.2 age@1.3.2 lua@5.5.1 shfmt@3.14.1 zoxide@0.10.0
      - name: Run isolated Linux tests
        shell: bash
        run: |
          export NU_BIN="$(mise exec nu@0.115.1 -- which nu)"
          export FNOX_BIN="$(mise exec fnox@1.35.2 -- which fnox)"
          export ZOXIDE_BIN="$(mise exec zoxide@0.10.0 -- which zoxide)"
          export AGE_KEYGEN_BIN="$(mise exec age@1.3.2 -- which age-keygen)"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          mise exec lua@5.5.1 -- lua tests/test_wezterm.lua "$PWD"
          mise exec shfmt@3.14.1 -- make lint

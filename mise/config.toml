# Windows binaries from LuaBinaries, linked by https://www.lua.org/download.html.
# SHA-256 pins the trusted first download, not a signature from the Lua authors.
# When changing versions, verify the new ZIP and update its checksum too.
[tools."http:lua"]
version = "5.5.0"
os = ["windows/x64"]
url = "https://downloads.sourceforge.net/project/luabinaries/{{ version }}/Tools%20Executables/lua-{{ version }}_Win64_bin.zip"
checksum = "sha256:7825cb261d0dc61cb0e1511d451ceaf10bf72d2bba1855bfd3350add190e0024"
rename_exe = { "lua[0-9]*.exe" = "lua.exe", "luac[0-9]*.exe" = "luac.exe", "wlua[0-9]*.exe" = "wlua.exe" }

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[settings.python]
uv_venv_auto = "source"

[settings.pipx]
uvx = true

[tools]
deno = "latest"
elixir = "latest"
erlang = "latest"
go = "latest"
java = "latest"
lua = "latest"
node = "latest"
# another npm client, mise uses it, jdx made it
aube = "latest"
pnpm = "latest"
"npm:@biomejs/biome" = "latest"
python = "latest"
rust = "latest"
uv = "latest"
"npm:@mermaid-js/mermaid-cli" = "latest"
"npm:@openai/codex" = "latest"
yamlfmt = "latest"
yq = "latest"
# tv - fuzzy finder
television = "latest"
"github:earendil-works/pi" = { version = "latest", minimum_release_age = "6h" }
tmux = "latest"
pitchfork = "latest"
# gh cli
"aqua:cli/cli" = "2.87.3"
"npm:prettier" = "latest"
fd = "latest"
jj = "latest"
"cargo:jj-starship" = "latest"
1password-cli = "latest"
zig = "latest"
zls = "latest"
"aqua:JohnnyMorganz/StyLua" = "latest"
"pipx:pre-commit" = "latest"
"cargo:qsv" = "latest"
claude-code = "latest"
shfmt = "latest"
cmake = "latest"
shellcheck = "latest"
delta = "latest"
"npm:obsidian-headless" = "latest"
tree-sitter = "latest"
yazi = "latest"
bun = "latest"
# another diff viewer
"npm:hunkdiff" = "latest"
actionlint = "latest"
taplo = "latest"
"npm:@tobilu/qmd" = { version = "latest", allow_builds = [
  "better-sqlite3",
  "node-llama-cpp",
  "tree-sitter-go",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
] }
cloudflared = "latest"
herdr = "latest"
"github:openclaw/gogcli" = "latest"
gcloud = "latest"
"cargo:jj-hunk" = "latest"
grok = { version = "latest", bin = "grok", platforms = { windows-arm64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-aarch64.exe" }, windows-x64 = { bin = "grok.exe", url = "https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-windows-x86_64.exe" } }, url = 'https://storage.googleapis.com/grok-build-public-artifacts/cli/grok-{{ version }}-{{ os() }}-{{ arch(x64="x86_64", arm64="aarch64") }}', version_list_url = "https://x.ai/cli/stable" }

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[settings.python]
uv_venv_auto = "source"

[settings.pipx]
uvx = true
